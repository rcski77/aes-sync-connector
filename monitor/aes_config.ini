[aes]
# AES Scheduler connection settings
host     = 100.83.86.18
port     = 17471
password = ${AES_PASSWORD}

# Opt-in: let the dashboard send score corrections into AES over this
# connection (see CLAUDE.md "Dashboard Outbox API"). Default false — the
# monitor is read-only unless this is explicitly turned on.
allow_writeback = false

[bridge]
# Path to compiled AESBridge.exe (relative to this config file)
exe = ..\bridge\bin\Release\net48\AESBridge.exe

[dashboard]
# Your dashboard API endpoint — monitor will POST tournament_data.json here
# after every AES update. Set to empty string to disable HTTP push.
endpoint = ${DASHBOARD_ENDPOINT}

# Shared secret sent as: Authorization: Bearer <key>
ingest_key = ${INGEST_API_KEY}

# Timeout in seconds for the HTTP POST
timeout = 30

# How often (seconds) to poll for pending score-correction commands when
# allow_writeback is true. Ignored otherwise.
outbox_poll_interval = 5