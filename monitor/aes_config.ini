[aes]
# AES Scheduler connection settings
host     = 127.0.0.1
port     = 17471
password = ${AES_PASSWORD}

[bridge]
# Path to compiled AESBridge.exe (relative to this config file)
exe = ..\bridge\bin\Release\net48\AESBridge.exe

[dashboard]
# Your dashboard API endpoint — monitor will POST tournament_data.json here
# after every AES update. Set to empty string to disable HTTP push.
endpoint = ${DASHBOARD_ENDPOINT}

# Optional: shared secret sent in X-AES-Token header for basic auth
# Leave empty to send with no authentication header
token = ${DASHBOARD_TOKEN}

# Timeout in seconds for the HTTP POST
timeout = 10
