name: Release

# Builds the Windows sync client and publishes it as a GitHub release. The tournament director
# dashboard's CI (rcski77/aes-tourney-director, ci.yml) downloads the latest release's
# aes-sync-connector.zip into its web image, and directors download it from the event's Settings
# screen. The zip bundles AES's own EventScheduler_Release.exe, so the dashboard only serves it to
# signed-in directors - never publicly.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Same steps as build.bat, into out/ so nothing from a committed dist/ leaks into the zip.
          dotnet build bridge/AESBridge.csproj -c Release --nologo -v quiet
          if ($LASTEXITCODE -ne 0) { throw "AESBridge build failed" }

          python -m pip install --quiet pycryptodome pyinstaller==6.21.0
          # The label the monitor prints at startup - the same name as the release published below.
          $sha = git rev-parse --short HEAD
          "BUILD = `"build-${{ github.run_number }}-$sha`"" | Out-File -Encoding utf8NoBOM monitor/_build_info.py
          python -m PyInstaller --onefile --name "Relay Sync" --console `
            --distpath out/exe --workpath out/build --specpath out/build monitor/aes_monitor.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }

          # Stage the director-facing layout in a fresh folder. Only files copied here get zipped,
          # so stray files can never ride along. data/ is created by the monitor at first run.
          #   Relay Sync/
          #     Relay Sync.exe, README.txt   <- what the director sees
          #     app/                         <- bridge + AES assembly + config example (leave alone)
          $root = "out/pkg/Relay Sync"
          New-Item -ItemType Directory -Force "$root/app" | Out-Null
          Copy-Item "out/exe/Relay Sync.exe" $root
          Copy-Item bridge/bin/Release/net48/AESBridge.exe "$root/app/"
          Copy-Item bridge/bin/Release/net48/EventScheduler_Release.exe "$root/app/"
          Copy-Item monitor/aes_config.ini.example "$root/app/"
          Copy-Item monitor/README.txt "$root/README.txt"
          (Get-Content "$root/README.txt" -Raw) -replace '\{BUILD\}', $sha | Out-File -Encoding utf8 "$root/README.txt"

          Compress-Archive -Path $root -DestinationPath out/aes-sync-connector.zip -Force

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $sha = git rev-parse --short HEAD
          $tag = "build-${{ github.run_number }}-$sha"
          gh release create $tag out/aes-sync-connector.zip --target $env:GITHUB_SHA `
            --title "Sync client $tag" --notes "Built from $sha." --latest
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
